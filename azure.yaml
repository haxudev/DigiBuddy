# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"
name: digibuddy
services:
  ai-project:
    host: azure.ai.project
    endpoint: https://digibuddyfoundry.services.ai.azure.com/api/projects/digibuddyproj
  digibuddy-codex:
    host: azure.ai.agent
    uses:
      - ai-project
    project: .
    language: docker
    docker:
      path: hosted-agent/Dockerfile
      remoteBuild: true
    image: haxuinternalfoundryacr.azurecr.io/digibuddy-codex@sha256:8334d3ef17a9500f3b6cb50b6e6106768516b9a30b369b71cda3926e843a9226
    kind: hosted
    name: digibuddy-codex
    displayName: GTMBuddy Codex
    description: Codex coding runtime hosted in a Microsoft Foundry session sandbox.
    protocols:
      - protocol: responses
        version: 2.0.0
    # Teams and Microsoft 365 use the stable Activity endpoint, while the Web
    # UI and SDK clients keep using Responses. Both authorization schemes must
    # stay present: publishing with Shared scope adds BotServiceRbac, and Entra
    # remains the boundary for direct Foundry access.
    agentEndpoint:
      protocols:
        - responses
        - activity
      authorizationSchemes:
        - type: Entra
        - type: BotServiceRbac
    activity:
      useCase: simple
      publish:
        publishScope: shared
        appVersion: 1.0.0
        agentDisplayName: GTMBuddy
        shortDescription: Microsoft GTM assistant for Azure and field workflows.
        fullDescription: GTMBuddy helps Microsoft teams with Azure architecture, internal field guidance, ACR analysis, documents, and practical go-to-market workflows.
        developerName: Microsoft GTM
        developerWebsiteUrl: https://www.microsoft.com
        privacyUrl: https://privacy.microsoft.com/privacystatement
        termsOfUseUrl: https://www.microsoft.com/servicesagreement
    env:
      CODEX_MODEL_ENDPOINT: ${CODEX_MODEL_ENDPOINT}
      CODEX_MODEL_API_KEY: ${CODEX_MODEL_API_KEY}
      CODEX_MODEL_NAME: ${CODEX_MODEL_NAME}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT=medium}
      CODEX_APPROVAL_POLICY: never
      CODEX_SANDBOX: workspace-write
      CODEX_NETWORK_ACCESS: "true"
      AZURE_CLIENT_ID: ${AGENT_DIGIBUDDY_CODEX_INSTANCE_IDENTITY_CLIENT_ID}
      DIGIBUDDY_CONFIG_URI: https://digibuddyprodeus2.blob.core.windows.net/digibuddy-config
      DIGIBUDDY_CONFIG_API: https://digibuddy-webui.gentlemeadow-add1d43f.eastus2.azurecontainerapps.io/api/runtime
      DIGIBUDDY_CONFIG_API_SECRET: ${DIGIBUDDY_CONFIG_API_SECRET}
      DIGIBUDDY_ENABLE_PROFILE_CREDENTIALS: "true"
      # Foundry injects APPLICATIONINSIGHTS_CONNECTION_STRING itself from the
      # project's Application Insights connection -- setting it here is
      # rejected as reserved. The agent server then exports its own logs and
      # traces, and captures prompts and completions along with them unless
      # told not to. This is an internal Microsoft GTM assistant, so that
      # telemetry would carry what the user asked and what the knowledge base
      # answered. Diagnostics need the runtime's logs, not the conversation.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    container:
      resources:
        cpu: "2"
        memory: 4Gi
infra:
  provider: microsoft.foundry
