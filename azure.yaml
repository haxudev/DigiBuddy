# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"
name: digibuddy
services:
  ai-project:
    host: azure.ai.project
    endpoint: https://haxuinternalfoundry.services.ai.azure.com/api/projects/haxuinternalproj
  digibuddy-codex:
    host: azure.ai.agent
    uses:
      - ai-project
    project: .
    language: docker
    docker:
      path: hosted-agent/Dockerfile
      remoteBuild: true
    image: haxuinternalfoundryacr.azurecr.io/digibuddy-codex@sha256:473ceb10755ce757fdbbe44c1153e1f0b7c1540d9442ca156eb6f5fbe5b95434
    kind: hosted
    name: digibuddy-codex
    displayName: GTMBuddy Codex
    description: Codex coding runtime hosted in a Microsoft Foundry session sandbox.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      CODEX_MODEL_ENDPOINT: ${CODEX_MODEL_ENDPOINT}
      CODEX_MODEL_API_KEY: ${CODEX_MODEL_API_KEY}
      CODEX_MODEL_NAME: ${CODEX_MODEL_NAME}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT=medium}
      CODEX_APPROVAL_POLICY: never
      CODEX_SANDBOX: workspace-write
      CODEX_NETWORK_ACCESS: "true"
      AZURE_CLIENT_ID: ${AGENT_DIGIBUDDY_CODEX_INSTANCE_IDENTITY_CLIENT_ID}
      DIGIBUDDY_CONFIG_URI: https://digibuddyprodeus2.blob.core.windows.net/digibuddy-config
      DIGIBUDDY_CONFIG_API: https://digibuddy-webui.gentlemeadow-add1d43f.eastus2.azurecontainerapps.io/api/runtime
      DIGIBUDDY_CONFIG_API_SECRET: ${DIGIBUDDY_CONFIG_API_SECRET}
      DIGIBUDDY_ENABLE_PROFILE_CREDENTIALS: "true"
    container:
      resources:
        cpu: "2"
        memory: 4Gi
infra:
  provider: microsoft.foundry
